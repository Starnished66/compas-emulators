name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the mipsel musl cross toolchain
        shell: bash
        run: .github/scripts/install-toolchain.sh "$RUNNER_TEMP/toolchain" | tail -n 1 >> "$GITHUB_PATH"
      - name: Build for the device
        run: make
      - name: Host self-test
        run: make selftest
      - name: Smoke test under qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          tools/fetch_test_roms.sh
          make smoke
      - name: Build the packages and the store index
        run: make package
      - name: Validate the store index
        run: python3 tools/build_index.py --validate dist
